name: Caddy Version Monitor

on:
  schedule:
    - cron: '30 2 * * 1'  # Monday at 2:30 AM UTC
  workflow_dispatch:

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      DH_REPO: ${{ steps.repo_name.outputs.DH_REPO }}
      BUILD_TIME: ${{ steps.date.outputs.BUILD_TIME }}
      GH_BUILD_TAG: ${{ steps.check.outputs.GH_BUILD_TAG }}
      GH_LATEST_TAG: ${{ steps.check.outputs.GH_LATEST_TAG }}
      PLATFORMS: ${{ steps.set_platforms.outputs.PLATFORMS }}
      VERSION: ${{ steps.check.outputs.VERSION }}
      SHOULD_BUILD: ${{ steps.check.outputs.should_build }}
      DERIVED_ARG_01: ${{ steps.check.outputs.DERIVED_ARG_01 }}
    steps:
      - name: Setup DockerHub Repo Name
        id: repo_name
        run: |
          echo "DH_REPO=misc_images" >> $GITHUB_OUTPUT

      - name: Run date command
        id: date
        run: |
          buildTime=$(date +%Y-%m-%d" "%X)
          echo "BUILD_TIME=$buildTime" >> $GITHUB_OUTPUT

      - name: Check for new Caddy version
        id: check
        run: |
          # Get latest release from GitHub
          LATEST=$(curl -fsSL https://api.github.com/repos/caddyserver/caddy/releases/latest | jq -r '.tag_name')
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "Failed to fetch latest Caddy version"
            exit 1
          fi
          echo "Latest Caddy release: $LATEST"

          # Strip leading 'v' for Docker tag
          VERSION="${LATEST#v}"

          # Check Docker Hub for existing tags
          LAN_EXISTS=$(curl -fsSL "https://hub.docker.com/v2/repositories/${{ secrets.DOCKERHUB_USERNAME }}/misc_images/caddy-${VERSION}-lan" 2>/dev/null | jq -r '.name' || echo "")
          WAN_EXISTS=$(curl -fsSL "https://hub.docker.com/v2/repositories/${{ secrets.DOCKERHUB_USERNAME }}/misc_images/caddy-${VERSION}-wan" 2>/dev/null | jq -r '.name' || echo "")

          if [ "$LAN_EXISTS" = "caddy-${VERSION}-lan" ] && [ "$WAN_EXISTS" = "caddy-${VERSION}-wan" ]; then
            echo "Both LAN and WAN images already exist for $VERSION"
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "New version detected: $VERSION (LAN exists: ${LAN_EXISTS:-no}, WAN exists: ${WAN_EXISTS:-no})"
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "GH_BUILD_TAG=$VERSION" >> $GITHUB_OUTPUT
          echo "GH_LATEST_TAG=latest" >> $GITHUB_OUTPUT

          if [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "DERIVED_ARG_01=${VERSION}-builder" >> $GITHUB_OUTPUT
          else
            echo "DERIVED_ARG_01=builder" >> $GITHUB_OUTPUT
          fi

      - name: Set platforms
        id: set_platforms
        run: |
          echo "PLATFORMS=linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6" >> $GITHUB_OUTPUT

      - name: Show workflow variables
        run: |
          echo "------------------------------------------------------------------"
          echo "DH_REPO: ${{ steps.repo_name.outputs.DH_REPO }}"
          echo "BUILD_TIME: ${{ steps.date.outputs.BUILD_TIME }}"
          echo "VERSION: ${{ steps.check.outputs.VERSION }}"
          echo "GH_BUILD_TAG: ${{ steps.check.outputs.GH_BUILD_TAG }}"
          echo "GH_LATEST_TAG: ${{ steps.check.outputs.GH_LATEST_TAG }}"
          echo "PLATFORMS: ${{ steps.set_platforms.outputs.PLATFORMS }}"
          echo "SHOULD_BUILD: ${{ steps.check.outputs.should_build }}"
          echo "DERIVED_ARG_01: ${{ steps.check.outputs.DERIVED_ARG_01 }}"
          echo "------------------------------------------------------------------"

  build-lan:
    runs-on: ubuntu-latest
    needs: prep
    if: needs.prep.outputs.SHOULD_BUILD == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push - LAN
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.caddy
          push: true
          platforms: ${{ needs.prep.outputs.PLATFORMS }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ needs.prep.outputs.DH_REPO }}:caddy-${{ needs.prep.outputs.VERSION }}-lan
          build-args: |-
            BUILD_TIME=${{ needs.prep.outputs.BUILD_TIME }}
            DOCKERFILE=caddy
            VERSION=${{ needs.prep.outputs.VERSION }}
            ARG_01=${{ needs.prep.outputs.VERSION }}
            ARG_02=false
            ${{ needs.prep.outputs.DERIVED_ARG_01 && format('DERIVED_ARG_01={0}', needs.prep.outputs.DERIVED_ARG_01) }}

      - name: Summary
        run: |
          echo "Built and pushed Caddy ${{ needs.prep.outputs.VERSION }} (LAN)"

  build-wan:
    runs-on: ubuntu-latest
    needs: prep
    if: needs.prep.outputs.SHOULD_BUILD == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push - WAN
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.caddy
          push: true
          platforms: ${{ needs.prep.outputs.PLATFORMS }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ needs.prep.outputs.DH_REPO }}:caddy-${{ needs.prep.outputs.VERSION }}-wan
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ needs.prep.outputs.DH_REPO }}:caddy-latest
          build-args: |-
            BUILD_TIME=${{ needs.prep.outputs.BUILD_TIME }}
            DOCKERFILE=caddy
            VERSION=${{ needs.prep.outputs.VERSION }}
            ARG_01=${{ needs.prep.outputs.VERSION }}
            ARG_02=true
            ${{ needs.prep.outputs.DERIVED_ARG_01 && format('DERIVED_ARG_01={0}', needs.prep.outputs.DERIVED_ARG_01) }}

      - name: Summary
        run: |
          echo "Built and pushed Caddy ${{ needs.prep.outputs.VERSION }} (WAN + latest)"
