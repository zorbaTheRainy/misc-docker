# Organize-tool watches /watched for new files and sorts them according
# to rules defined in organize.yaml. Webhooks notify on activity.
# Docs: https://github.com/tfeldmann/organize
#
# Logs: docker logs -f organize-watcher
#   - entrypoint prints which crontab is used and its full contents
#   - each scheduled run is prefixed [run-organize] / [organize]
# Debug: set SUPERCRONIC_DEBUG=1 for supercronic schedule detail

services:
  organize-tool:
    image: zorbatherainy/misc_images:organize-tool-latest
    container_name: organize-watcher
    hostname: organize-watcher
    # restart: unless-stopped
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 5
    environment:
      TZ: "${TZ:-UTC}"
      # Host volume ownership (LSIO-style). Entrypoint defaults are 911:911 if unset.
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-100}"
      WEBHOOK_BASE_URL: "${WEBHOOK_BASE_URL:-http://localhost:5432/webhook/}"
      WEBHOOK_SITE: "${WEBHOOK_SITE:-hook_relay}"
      # SUPERCRONIC_DEBUG: "1"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # Mount a directory containing organize.yaml (and optional crontab)
      - ${HOME}/gitcode/lan/webhooks/hooks/organize-tool/config:/app/config:ro
      - organize_state:/app/state
      # - ./scripts_user:/app/scripts_user:ro
      - /organize_watched:/watched
    healthcheck:
      test: ["CMD-SHELL", "find /app/state/heartbeat -mmin -20 | grep -q ."]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 2m

volumes:
  organize_state:
