# Organize-tool watches /watched for new files and sorts them according
# to rules defined in organize.yaml. Webhooks notify on activity.
# Docs: https://github.com/tfeldmann/organize

services:
  organize-tool:
    image: zorbatherainy/misc_images:organize-tool-latest
    container_name: organize-watcher
    hostname: organize-watcher
    # restart: unless-stopped
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 5
    environment:
      TZ: "${TZ:-UTC}"
      # Set the PUID & PGID to allow the container to access host volumes with the correct permissions.
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-100}"
      # Any other ENVs needed for the sciprt sot work (e.g., the global send_webhook.py script)
      WEBHOOK_BASE_URL: "${WEBHOOK_BASE_URL:-http://192.168.72.40:5432/webhook/}"
      WEBHOOK_SITE: "${WEBHOOK_SITE:-hook_relay}"
    volumes:
      - /etc/localtime:/etc/localtime:ro                             # sync to host time (and avoid the TZ Env variable)
      # Config mappings
      - /home/REMOVED/gitcode/lan/webhooks/hooks/organize-tool/config/organize.yaml:/app/config/:ro
      - organize_state:/app/state                                     # persists supercronic run state
      #  Data & Scripts mappings
      # - ./scripts_user:/app/scripts_user:ro
      - /mnt/920p/Incoming_Files/2_AutoPirate/2_Processing/organize_watched:/watched
    healthcheck:
      test: ["CMD-SHELL", "find /app/state/heartbeat -mmin -20 | grep -q ."]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 2m

# ###################################################################
# VOLUMES
# ###################################################################
volumes:
  organize_state:
